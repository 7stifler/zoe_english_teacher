<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teacher Zoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="hero-header">
    <svg class="path-swoosh" viewBox="0 0 400 160" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10,140 C80,110 90,60 180,55 C260,50 270,100 410,70"
            fill="none" stroke="#F5A623" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    </svg>
    <div class="hero-row">
      <span class="zoe-avatar-wrap">
        <img class="zoe-avatar" src="img/zoe-avatar.png" alt="Teacher Zoe" width="84" height="84">
        <span class="zoe-wave" aria-hidden="true"><i></i><i></i><i></i></span>
      </span>
      <div>
        <h1>שלום! אני Teacher Zoe 👋</h1>
        <p>המורה שלך לתרגול אנגלית</p>
      </div>
      <span class="points-pill" id="points-pill" style="margin-inline-start:auto;">⭐ 0</span>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="section-label">בחרי לאן ממשיכים</div>

  <div class="hub">
    <a class="hub-node" href="speaking.html">
      <span class="hub-start-tag">מתחילים כאן</span>
      <div class="hub-circle hub-circle-lg">🗣️</div>
      <div class="hub-label">תרגול דיבור</div>
      <div class="hub-sub">שיחה עם Zoe, בלי פחד לטעות</div>
    </a>

    <div class="hub-row">
      <a class="hub-node" href="vocab.html">
        <div class="hub-circle hub-circle-md hub-circle-vocab">🎮</div>
        <div class="hub-label hub-label-md">אוצר מילים</div>
        <div class="hub-sub">כרטיסיות + משחק נקודות</div>
      </a>
      <a class="hub-node" href="reading.html">
        <div class="hub-circle hub-circle-md hub-circle-reading">🗺️</div>
        <div class="hub-label hub-label-md">מסלול קריאה</div>
        <div class="hub-sub">תחנות + שאלות הבנה</div>
      </a>
    </div>

    <div class="hub-node-locked">
      <div class="hub-circle-locked">🔒</div>
      <div class="hub-label-locked">עוד דרכים בקרוב...</div>
    </div>
  </div>
</div>

<script src="js/progress.js"></script>
<script>
  const summary = ZoeProgress.getSummary();
  document.getElementById("points-pill").textContent = `⭐ ${summary.points}`;

  const statsRow = document.getElementById("stats-row");
  const stats = [
    { label: "נקודות", value: summary.points, icon: "⭐" },
    { label: "תחנות קריאה", value: summary.passagesCompleted, icon: "🗺️" },
    { label: "שיחות דיבור", value: summary.speakingTurns, icon: "🗣️" },
  ];
  statsRow.innerHTML = stats.map(s => `
    <span class="stat-pill">${s.icon} <b>${s.value}</b> ${s.label}</span>
  `).join("");
</script>
</body>
</html>
