<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Zoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <div class="hero-header">
    <svg class="path-swoosh" viewBox="0 0 400 160" preserveAspectRatio="none" aria-hidden="true">
      <path d="M-10,140 C80,110 90,60 180,55 C260,50 270,100 410,70"
            fill="none" stroke="#F5A623" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>
    </svg>
    <div class="hero-row">
      <span class="zoe-avatar-wrap">
        <img class="zoe-avatar" src="img/zoe-avatar.png" alt="Teacher Zoe" width="84" height="84">
        <span class="zoe-wave" aria-hidden="true"><i></i><i></i><i></i></span>
      </span>
      <div>
        <h1>שלום! אני Teacher Zoe 👋</h1>
        <p>המורה שלך לתרגול אנגלית</p>
      </div>
      <span class="points-pill" id="points-pill" style="margin-inline-start:auto;">⭐ 0</span>
    </div>
  </div>

  <div class="stats-row" id="stats-row"></div>

  <div class="section-label">המסלולים שלך</div>
  <div class="module-grid">
    <a class="module-card featured" href="speaking.html">
      <div class="module-icon speaking">🗣️</div>
      <div>
        <h2>תרגול דיבור</h2>
        <p>שיחה עם Zoe, בלי פחד לטעות</p>
      </div>
    </a>

    <a class="module-card" href="vocab.html">
      <div class="module-icon vocab">🎮</div>
      <div>
        <h2>אוצר מילים</h2>
        <p>כרטיסיות + משחק נקודות</p>
      </div>
    </a>

    <a class="module-card" href="reading.html">
      <div class="module-icon reading">🗺️</div>
      <div>
        <h2>מסלול קריאה</h2>
        <p>תחנות מתקדמות + שאלות הבנה</p>
      </div>
    </a>
  </div>
</div>

<script src="js/progress.js"></script>
<script>
  const summary = ZoeProgress.getSummary();
  document.getElementById("points-pill").textContent = `⭐ ${summary.points}`;

  const statsRow = document.getElementById("stats-row");
  const stats = [
    { label: "נקודות", value: summary.points, icon: "⭐" },
    { label: "תחנות קריאה", value: summary.passagesCompleted, icon: "🗺️" },
    { label: "שיחות דיבור", value: summary.speakingTurns, icon: "🗣️" },
  ];
  statsRow.innerHTML = stats.map(s => `
    <div class="card stat-tile">
      <div class="stat-icon">${s.icon}</div>
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </div>
  `).join("");
</script>
</body>
</html>
