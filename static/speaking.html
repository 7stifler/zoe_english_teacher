<!doctype html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>תרגול דיבור עם Zoe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">‹ חזרה</a>

  <header class="top-bar">
    <img class="zoe-avatar" src="img/zoe-avatar.png" alt="Teacher Zoe" width="64" height="64">
    <div>
      <h1 style="font-size:1.15rem;">תרגול דיבור</h1>
      <p id="turn-counter">בואי נדבר קצת אנגלית!</p>
    </div>
    <span class="points-pill" id="points-pill" style="margin-inline-start:auto;">⭐ 0</span>
  </header>

  <div class="card" id="picker-card">
    <p style="margin:0 0 10px;font-weight:600;">על מה תרצי לדבר היום?</p>
    <div class="category-picker" id="category-picker">
      <span class="status-line">טוען נושאים...</span>
    </div>
  </div>

  <div id="chat-card" class="card" style="display:none;">
    <div class="chat-log" id="chat-log"></div>

    <div class="speaking-stage">
      <button id="mic-btn" class="mic-button" aria-label="דברי עכשיו">🎤</button>
      <div class="status-line" id="status-line">לחצי על המיקרופון ותתחילי לדבר</div>
    </div>

    <div style="text-align:center;">
      <button class="btn btn-secondary" id="change-topic-btn">🔄 נושא אחר</button>
    </div>
  </div>

  <div id="unsupported-card" class="card" style="display:none;">
    <p>הדפדפן הזה לא תומך בזיהוי דיבור 🙁</p>
    <p style="color:var(--brown-soft);font-size:0.9rem;">נסי לפתוח את האתר ב-Google Chrome.</p>
  </div>
</div>

<script src="js/tts-en.js"></script>
<script src="js/progress.js"></script>
<script src="js/speaking.js"></script>
</body>
</html>
